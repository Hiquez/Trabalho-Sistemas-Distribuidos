
spring.application.name=agendaecapacidade
server.port=8081

spring.docker.compose.enabled=false

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/agenda_capacidade
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://127.0.0.1:5434/agenda_capacidade
spring.flyway.user=postgres
spring.flyway.password=postgres123

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true