services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: coleta-oracle
    environment:
      TZ: UTC
      ORA_SDTZ: "+00:00"
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      SOLICITACOES_PASSWORD: ${SOLICITACOES_PASSWORD:?configure a senha}
      AGENDA_CAPACIDADE_PASSWORD: ${AGENDA_CAPACIDADE_PASSWORD:?configure a senha}
      COOPERATIVA_PASSWORD: ${COOPERATIVA_PASSWORD:?configure a senha}
      COLETAS_DESTINACAO_PASSWORD: ${COLETAS_DESTINACAO_PASSWORD:?configure a senha}
    ports:
      - "1522:1521"
    volumes:
      - oracle_data_v2:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d:ro
      - ./database/init:/container-entrypoint-startdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: coleta-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  solicitacoes:
    build:
      context: .
      dockerfile: solicitacoes/Dockerfile
    container_name: coleta-solicitacoes
    ports:
      - "8081:8080"
    environment:
      MQ_QUEUE_AGENDA_CONFIRMADA: ${MQ_QUEUE_AGENDA_CONFIRMADA:-agenda.confirmada}
      MQ_QUEUE_COLETAS_COLETA_CONFIRMADA: ${MQ_QUEUE_COLETAS_COLETA_CONFIRMADA:-coletas.coleta-confirmada}
      MQ_QUEUE_SOLICITACOES_RESULTADO: ${MQ_QUEUE_SOLICITACOES_RESULTADO:-solicitacoes.resultado}
      MQ_QUEUE_SOLICITACOES_ACEITE: ${MQ_QUEUE_SOLICITACOES_ACEITE:-solicitacoes.aceite}
      MQ_QUEUE_SOLICITACOES_RECUSA: ${MQ_QUEUE_SOLICITACOES_RECUSA:-solicitacoes.recusa}
      MQ_QUEUE_SOLICITACOES_CANCELADO: ${MQ_QUEUE_SOLICITACOES_CANCELADO:-solicitacoes.cancelado}
      MQ_QUEUE_SOLICITACOES_EXECUTADA: ${MQ_QUEUE_SOLICITACOES_EXECUTADA:-solicitacoes.executada}
      MQ_QUEUE_SOLICITACOES_TRIADA: ${MQ_QUEUE_SOLICITACOES_TRIADA:-solicitacoes.triada}
      MQ_QUEUE_SOLICITACOES_DESTINADA: ${MQ_QUEUE_SOLICITACOES_DESTINADA:-solicitacoes.destinada}
      TZ: UTC
      ORA_SDTZ: "+00:00"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      DB_SECRET_NAME: coleta/solicitacoes
      SECRETS_ENDPOINT: http://ministack:4566

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"

      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"

      SAGA_TIMEOUT_SECONDS: ${SAGA_TIMEOUT_SECONDS:-60}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ministack-init:
        condition: service_completed_successfully

  agenda:
    build:
      context: .
      dockerfile: agendaecapacidade/Dockerfile
    container_name: coleta-agenda
    ports:
      - "8082:8080"
    environment:
      MQ_QUEUE_AGENDA_CRIADA: ${MQ_QUEUE_AGENDA_CRIADA:-agenda.criada}
      MQ_QUEUE_AGENDA_LIBERAR: ${MQ_QUEUE_AGENDA_LIBERAR:-agenda.liberar}
      MQ_QUEUE_AGENDA_CONFIRMADA: ${MQ_QUEUE_AGENDA_CONFIRMADA:-agenda.confirmada}
      TZ: UTC
      ORA_SDTZ: "+00:00"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      DB_SECRET_NAME: coleta/agenda
      SECRETS_ENDPOINT: http://ministack:4566

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"

      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ministack-init:
        condition: service_completed_successfully

  cooperativa:
    build:
      context: .
      dockerfile: cooperativaparceira/Dockerfile
    ports:
      - "8080"
    environment:
      MQ_QUEUE_COOPERATIVA_SOLICITAR_ACEITE: ${MQ_QUEUE_COOPERATIVA_SOLICITAR_ACEITE:-cooperativa.solicitar-aceite}
      MQ_QUEUE_COOPERATIVA_CANCELAR_COMPROMISSO: ${MQ_QUEUE_COOPERATIVA_CANCELAR_COMPROMISSO:-cooperativa.cancelar-compromisso}
      TZ: UTC
      ORA_SDTZ: "+00:00"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      DB_SECRET_NAME: coleta/cooperativa
      SECRETS_ENDPOINT: http://ministack:4566

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"

      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"

      COOPERATIVA_SCHEDULER_POOL_SIZE: ${COOPERATIVA_SCHEDULER_POOL_SIZE:-2}
      COOPERATIVA_TAXA_RECUSA: ${COOPERATIVA_TAXA_RECUSA:-0}
      COOPERATIVA_TAXA_FALHA: ${COOPERATIVA_TAXA_FALHA:-0}
      COOPERATIVA_LATENCIA_MIN_MS: ${COOPERATIVA_LATENCIA_MIN_MS:-100}
      COOPERATIVA_LATENCIA_MAX_MS: ${COOPERATIVA_LATENCIA_MAX_MS:-2000}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ministack-init:
        condition: service_completed_successfully

  coletas:
    build:
      context: .
      dockerfile: coletasedestinacao/Dockerfile
    ports:
      - "8084:8080"
    environment:
      MQ_QUEUE_COLETAS_COLETA_CONFIRMADA: ${MQ_QUEUE_COLETAS_COLETA_CONFIRMADA:-coletas.coleta-confirmada}
      TZ: UTC
      ORA_SDTZ: "+00:00"
      SERVER_PORT: 8080
      DB_DSN: oracle:1521/FREEPDB1


      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_EC2_METADATA_DISABLED: "true"

      S3_BUCKET: ${S3_BUCKET:-coleta-comprovantes}
      S3_ENDPOINT: http://ministack:4566

      DB_SECRET_NAME: coleta/coletas
      SECRETS_ENDPOINT: http://ministack:4566
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ministack-init:
        condition: service_completed_successfully

  ministack:
    image: ministackorg/ministack:latest
    container_name: coleta-ministack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      S3_DATA_DIR: /data/s3
    volumes:
      - ministack_data:/data
    restart: unless-stopped

  ministack-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    container_name: coleta-ministack-init
    entrypoint:
      - /bin/sh
      - /scripts/01-create-bucket.sh
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"

      S3_ENDPOINT: http://ministack:4566
      S3_BUCKET: ${S3_BUCKET:-coleta-comprovantes}

      SOLICITACOES_PASSWORD: ${SOLICITACOES_PASSWORD:?configure a senha}
      AGENDA_CAPACIDADE_PASSWORD: ${AGENDA_CAPACIDADE_PASSWORD:?configure a senha}
      COOPERATIVA_PASSWORD: ${COOPERATIVA_PASSWORD:?configure a senha}
      COLETAS_DESTINACAO_PASSWORD: ${COLETAS_DESTINACAO_PASSWORD:?configure a senha}
    volumes:
      - ./infrastructure/ministack/init:/scripts:ro
    depends_on:
      ministack:
        condition: service_started
    restart: "no"

volumes:
  oracle_data:
  oracle_data_v2:
  rabbitmq_data:
  ministack_data:
