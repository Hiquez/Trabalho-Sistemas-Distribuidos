
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: coleta-oracle
    environment:
      TZ: UTC
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "1522:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: coleta-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  solicitacoes:
    build: ./solicitacoes
    container_name: coleta-solicitacoes
    ports:
      - "8081:8080"
    environment:
      TZ: UTC
      ORA_SDTZ: UTC
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: SOLICITACOES
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  agenda:
    build: ./agendaecapacidade
    container_name: coleta-agenda
    ports:
      - "8082:8080"
    environment:
      TZ: UTC
      ORA_SDTZ: UTC
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: AGENDA_CAPACIDADE
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cooperativa:
    build: ./cooperativaparceira
    ports:
      - "8080"
    environment:
      TZ: UTC
      ORA_SDTZ: UTC
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: COOPERATIVA
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  coletas:
    build: ./coletasedestinacao
    container_name: coleta-destinacao
    ports:
      - "8084:8080"
    environment:
      TZ: UTC
      ORA_SDTZ: UTC
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -Doracle.jdbc.timezoneAsRegion=false"
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-none}
      SERVER_PORT: 8080
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: COLETAS_DESTINACAO
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-coleta-comprovantes}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://ministack:4566}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ministack-init:
        condition: service_completed_successfully

  ministack:
    image: ministackorg/ministack:latest
    container_name: coleta-ministack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
    volumes:
      - ministack_data:/data
    restart: unless-stopped

  # Inicializa os recursos AWS emulados antes de iniciar o servico de coletas.
  ministack-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    container_name: coleta-ministack-init
    entrypoint: ["/bin/sh", "/scripts/01-create-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://ministack:4566
      S3_BUCKET: ${S3_BUCKET:-coleta-comprovantes}
    volumes:
      - ./infrastructure/ministack/init:/scripts:ro
    depends_on:
      ministack:
        condition: service_started
    restart: "no"

volumes:
  oracle_data:
  rabbitmq_data:
  ministack_data:
